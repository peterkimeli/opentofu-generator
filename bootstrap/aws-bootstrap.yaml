AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time setup for opentofu-generator: an EC2 self-hosted GitHub Actions
  runner whose instance role carries the least-privilege permissions needed to
  apply and destroy the generated stack. No AWS keys are stored in GitHub.

Parameters:
  GitHubRepo:
    Type: String
    Default: peterkimeli/opentofu-generator
    Description: owner/repo the runner registers with
  RunnerToken:
    Type: String
    NoEcho: true
    Description: GitHub runner registration token (valid for 1 hour)
  InstanceType:
    Type: String
    Default: t3.small
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: opentofu-generator-runner
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # Session Manager access for debugging the instance.
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: generated-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Buckets are always named "<name>-<account id>-<region>".
              - Sid: S3
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::*-${AWS::AccountId}-*
                  - !Sub arn:${AWS::Partition}:s3:::*-${AWS::AccountId}-*/*
              - Sid: SQS
                Effect: Allow
                Action: sqs:*
                Resource: !Sub arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:*
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:*
              - Sid: LogGroups
                Effect: Allow
                Action: logs:*
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/*
              - Sid: LogsDescribe
                Effect: Allow
                Action: [logs:DescribeLogGroups, logs:ListTagsForResource]
                Resource: "*"
              # Only the Lambda execution roles the generator creates ("*-role").
              - Sid: LambdaRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRoleTags
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*-role
              - Sid: AttachBasicExecutionOnly
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*-role
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*-role
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

  RunnerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref RunnerRole]

  # No ingress rules; the default egress rule allows outbound traffic only.
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GitHub Actions runner - outbound only

  Runner:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref RunnerProfile
      SecurityGroupIds: [!GetAtt RunnerSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 20, VolumeType: gp3, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: opentofu-generator-runner }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/runner-setup.log 2>&1

          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile

          apt-get update -y
          apt-get install -y curl jq unzip git

          useradd -m -s /bin/bash runner
          cd /home/runner
          VERSION=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -fsSL -o runner.tgz "https://github.com/actions/runner/releases/download/v$VERSION/actions-runner-linux-x64-$VERSION.tar.gz"
          tar xzf runner.tgz && rm runner.tgz
          ./bin/installdependencies.sh
          chown -R runner:runner /home/runner

          sudo -u runner ./config.sh --unattended \
            --url "https://github.com/${GitHubRepo}" \
            --token "${RunnerToken}" \
            --name "aws-ec2-$(hostname)" \
            --labels "self-hosted,linux,x64,aws-ec2" \
            --replace
          ./svc.sh install runner
          ./svc.sh start

Outputs:
  RunnerInstanceId:
    Value: !Ref Runner
  RunnerRoleArn:
    Value: !GetAtt RunnerRole.Arn
