name: Deploy

# Runs the full lifecycle the task asks for, in one job so state never has to
# leave the runner: apply -> plan (must report no changes) -> destroy.
on:
  workflow_dispatch:
    inputs:
      region:
        description: Override the input's region (empty = repo variable DEPLOY_REGION, else the input file)
        type: string
        default: ""
      destroy:
        description: Destroy the stack at the end of the run
        type: boolean
        default: true

# AWS credentials come from the self-hosted runner's EC2 instance role (see
# bootstrap/aws-bootstrap.yaml), so no AWS keys are stored in GitHub.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.13.1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  lifecycle:
    # Set the repo variable RUNNER_LABEL (e.g. "self-hosted") to use another runner.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Check committed main.tf is up to date
        run: |
          npm ci
          npm run generate
          git diff --exit-code infra/main.tf

      - name: Generate deploy/main.tf
        env:
          REGION: ${{ inputs.region || vars.DEPLOY_REGION }}
        run: |
          mkdir -p logs
          npx tsx src/index.ts examples/input.json deploy/main.tf ${REGION:+--region "$REGION"}
          cp infra/.terraform.lock.hcl deploy/
          echo "Differences from the committed infra/main.tf (region override only):"
          diff infra/main.tf deploy/main.tf | tee logs/region-diff.txt || true

      - name: tofu init
        id: init
        working-directory: deploy
        run: tofu init -no-color 2>&1 | tee ../logs/0-init.log; exit "${PIPESTATUS[0]}"

      - name: tofu apply
        id: apply
        working-directory: deploy
        run: tofu apply -auto-approve -no-color 2>&1 | tee ../logs/1-apply.log; exit "${PIPESTATUS[0]}"

      - name: tofu plan (second run must report no changes)
        id: plan
        working-directory: deploy
        run: |
          set +e
          tofu plan -detailed-exitcode -no-color 2>&1 | tee ../logs/2-plan.log
          code="${PIPESTATUS[0]}"
          case "$code" in
            0) echo "::notice::Second plan reports no changes" ;;
            2) echo "::error::Second plan is not empty - configuration is not idempotent"; exit 1 ;;
            *) exit "$code" ;;
          esac

      # Runs even if apply or plan failed, so a broken run never leaves
      # resources behind in the account.
      - name: tofu destroy
        id: destroy
        if: always() && steps.init.outcome == 'success' && inputs.destroy
        working-directory: deploy
        run: tofu destroy -auto-approve -no-color 2>&1 | tee ../logs/3-destroy.log; exit "${PIPESTATUS[0]}"

      - name: Check nothing is left in state
        if: always() && steps.destroy.outcome == 'success'
        working-directory: deploy
        run: |
          left="$(tofu state list)"
          if [ -n "$left" ]; then echo "::error::Resources still in state:"; echo "$left"; exit 1; fi
          echo "State is empty after destroy"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lifecycle"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| apply | ${{ steps.apply.outcome }} |"
            echo "| plan (no changes) | ${{ steps.plan.outcome }} |"
            echo "| destroy | ${{ steps.destroy.outcome }} |"
            for f in logs/1-apply.log logs/2-plan.log logs/3-destroy.log; do
              [ -f "$f" ] || continue
              echo; echo "### $f"; echo '```'; tail -n 25 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tofu-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
